name: Muninn

on:
  push:
    branches: [main, dev]
    paths:
      - "android/**"
      - "tests/chat-vectors.json"
      - "tools/get-fonts.sh"
      - ".github/workflows/muninn.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Fonts (same as Huginn)
        run: |
          tools/get-fonts.sh
          d=android/app/src/main/res/font; mkdir -p $d
          cp fonts/Cinzel.ttf $d/cinzel.ttf
          cp fonts/Barlow-Regular.ttf $d/barlow_regular.ttf
          cp fonts/Barlow-Medium.ttf $d/barlow_medium.ttf
          cp fonts/Barlow-SemiBold.ttf $d/barlow_semibold.ttf
          cp fonts/Barlow-Bold.ttf $d/barlow_bold.ttf
          cp fonts/NotoSansRunic-Regular.ttf $d/noto_sans_runic.ttf
      - name: Unit tests and APKs
        working-directory: android
        run: |
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease \
            2>&1 | tee build.log; status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then ci/annotate.sh build.log; exit $status; fi
      - name: Unit test failures
        if: failure()
        run: |
          for f in android/app/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$f" ] || continue
            python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          for tc in ET.parse(sys.argv[1]).getroot().iter("testcase"):
              for fl in list(tc.findall("failure")) + list(tc.findall("error")):
                  msg = (fl.get("message") or fl.text or "")[:800].replace("%", "%25").replace("\n", "%0A")
                  print(f"::error title=Test {tc.get('classname')}.{tc.get('name')}::{msg}")
          PY
          done
      - name: Version
        id: version
        run: |
          v=$(cat android/VERSION)
          tag="muninn-v$(echo "$v" | tr 'A-Z' 'a-z' | sed 's/ test /-test/')"
          echo "MUNINN_VERSION=$v" >> "$GITHUB_ENV"
          echo "MUNINN_TAG=$tag" >> "$GITHUB_ENV"
          cp android/app/build/outputs/apk/release/app-release.apk Muninn.apk
          if [ "$GITHUB_REF" = "refs/heads/main" ] && ! git ls-remote --exit-code --tags origin "$tag" >/dev/null 2>&1; then
            echo "MUNINN_RELEASE=1" >> "$GITHUB_ENV"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$(grep -q MUNINN_RELEASE=1 "$GITHUB_ENV" && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: muninn-apk
          path: |
            Muninn.apk
            android/app/build/outputs/apk/debug/app-debug.apk

  screens:
    # Opens every tab on an emulator, screenshots it, and fails on any crash.
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: muninn-apk
      - name: Put the debug APK where the script looks
        run: |
          mkdir -p android/app/build/outputs/apk/debug
          t=android/app/build/outputs/apk/debug/app-debug.apk
          [ -f "$t" ] || cp "$(find . -name app-debug.apk | head -1)" "$t"
          ls -l "$t"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: android/ci/screens.sh
      - name: Publish screenshots to the ci-muninn branch
        if: always()
        shell: bash
        run: |
          [ -d screens ] || exit 0
          cd screens
          git init -q -b ci-muninn
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Muninn screens for ${GITHUB_SHA::7}" || exit 0
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-muninn

  release:
    # Only after the emulator opened every screen without a crash.
    needs: [build, screens]
    if: needs.build.outputs.release == '1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: muninn-apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Muninn ${{ needs.build.outputs.version }}
          prerelease: ${{ contains(needs.build.outputs.version, 'Test') }}
          make_latest: false
          files: Muninn.apk
          body: |
            Muninn ${{ needs.build.outputs.version }}, the phone companion to Huginn.
            Install Muninn.apk on Android 8 or newer. Later versions update from inside the app.
