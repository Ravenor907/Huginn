name: Move release tags
on: workflow_dispatch
permissions:
  contents: write
jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Point each release tag at its cleaned commit
        shell: bash
        run: |
          set -eu
          move() { git tag -f "$1" "$2"; git push --force origin "refs/tags/$1"; }
          move v0.3 61f473d361fbff78932f5ca84733416b5320731f
          move v0.31 ceab04e55ce68354da8604820ae250fc5c93ebcd
          move v0.32 b8671bdb7ae4f1c6ff36bf443b60bebf4f04891e
          move v0.4 11f85ff652612f55bd49728b999c5306d4e2b2dd
